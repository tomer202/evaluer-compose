services:
  evaluer-dashboard:
    image: dashboard:v1
    container_name: evaluer-dashboard
    ports:
      - "3000:80"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal-net
    restart: unless-stopped

  evaluer:
    image: evaluer:v1
    container_name: evaluer
    # Comment/Un-Comment the port if you want to expose the API (not-secure)
    # ports:
    #   - "8000:8000"
    env_file:
      - ./.env
    volumes:
      - ./evaluer-config.yaml:/app/.local/config.yaml:rw

    expose:
      - "8000"
    networks:
      - internal-net
    restart: unless-stopped

networks:
  internal-net:
    driver: bridge
