services:
  evaluer-dashboard:
    image: dashboard:v1
    container_name: evaluer-dashboard
    ports:
      - "3000:80"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal-net
    restart: unless-stopped

  evaluer:
    image: evaluer:v1
    container_name: evaluer
    env_file:
      - ./evaluer/.env
    volumes:
      - ./evaluer/.local/config.yaml:/app/.local/config.yaml:ro
    expose:
      - "8000"
    networks:
      - internal-net
    restart: unless-stopped

networks:
  internal-net:
    driver: bridge
